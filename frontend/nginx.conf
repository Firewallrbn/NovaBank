server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # El gateway vive dentro de la red de Docker: el navegador siempre habla
    # contra rutas relativas /api y nginx las reenvía.
    location /api/ {
        proxy_pass http://api-gateway:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # El feed en vivo es SSE: sin búfer, sin caché y sin cortar la conexión.
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA: /simulador se resuelve en el cliente.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
